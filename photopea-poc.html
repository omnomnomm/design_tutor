<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Photopea Perception PoC</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
    }

    #pp-frame {
      flex: 3;
      border: none;
    }

    #panel {
      flex: 1;
      min-width: 320px;
      padding: 16px;
      background: #1e1e1e;
      color: #eee;
      overflow-y: auto;
    }

    button {
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 12px;
      width: 100%;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #111;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
    }

    h3 {
      margin-top: 0;
    }

    #lesson-label {
      font-size: 13px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #step-label {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    /* The track is the empty grey bar - just a container with fixed height */
    #progress-track {
      width: 100%;
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    /* The fill is the colored bar inside it - its WIDTH is what we change with JS */
    #progress-fill {
      height: 100%;
      width: 0%;
      background: #4caf50;
      transition: width 0.3s ease;
    }

    #instruction {
      background: #2a2a2a;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 14px;
      line-height: 1.4;
    }
  </style>
</head>

<body>

  <iframe id="pp-frame" src="https://www.photopea.com"></iframe>

  <div id="panel">
    <div id="lesson-label">Lesson 1</div>
    <div id="step-label">Step 1 of 3</div>
    <div id="progress-track">
    <div id="progress-fill"></div>
    </div>
    <div id="instruction">Create a layer named 'Background'.</div>
    <button id="check-btn" disabled>Loading Photopea...</button>
    <div id="status" style="color:#8f8; margin-bottom: 10px;"></div>
    <pre id="output">No data yet. Click the button above once Photopea has loaded and you've made a document.</pre>
  </div>

  <script src="tutor.js"></script>

</body>

</html>
